<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Home Status logo</title>
  <desc id="desc">A luminous house and shield mark with a live status timeline, designed for dark backgrounds.</desc>
  <defs>
    <linearGradient id="outline" x1="520" y1="130" x2="1080" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6FAFF"/>
      <stop offset="0.4" stop-color="#C5DCFF"/>
      <stop offset="0.72" stop-color="#4A9CFF"/>
      <stop offset="1" stop-color="#1476F2"/>
    </linearGradient>
    <linearGradient id="status" x1="620" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A70BC"/>
      <stop offset="0.5" stop-color="#55DFFF"/>
      <stop offset="1" stop-color="#2A70BC"/>
    </linearGradient>
    <radialGradient id="live">
      <stop stop-color="#F4FDFF"/>
      <stop offset="0.36" stop-color="#62E3FF"/>
      <stop offset="1" stop-color="#1688F5"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#1688F5" flood-opacity="0.28"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path d="M520 362L800 126L1080 362V520C1080 626 990 714 800 778C610 714 520 626 520 520V362Z"
        fill="none" stroke="#1688F5" stroke-opacity="0.14" stroke-width="56"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M520 362L800 126L1080 362V520C1080 626 990 714 800 778C610 714 520 626 520 520V362Z"
        fill="none" stroke="url(#outline)" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M644 512H956" stroke="#17395F" stroke-width="17" stroke-linecap="round"/>
  <path d="M644 512H956" stroke="url(#status)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="680" cy="512" r="25" fill="#0E2948" stroke="#4C9DF6" stroke-width="9"/>
  <circle cx="920" cy="512" r="25" fill="#0E2948" stroke="#4C9DF6" stroke-width="9"/>
  <circle cx="800" cy="512" r="43" fill="#1688F5" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="800" cy="512" r="33" fill="url(#live)" stroke="#C4F6FF" stroke-width="6"/>
  <circle cx="790" cy="502" r="8" fill="#FFFFFF" fill-opacity="0.82"/>
</svg>
