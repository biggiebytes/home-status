<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="800" viewBox="0 0 2400 800" role="img" aria-labelledby="title desc">
  <title id="title">Home Status documentation banner, light variant</title>
  <desc id="desc">The Home Status house and shield mark connected to a restrained live-awareness timeline on a light background.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="0" x2="2280" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="0.52" stop-color="#EAF2FC"/>
      <stop offset="1" stop-color="#DCE8F7"/>
    </linearGradient>
    <linearGradient id="outline" x1="160" y1="100" x2="880" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10243E"/>
      <stop offset="0.44" stop-color="#173E70"/>
      <stop offset="0.74" stop-color="#176FCE"/>
      <stop offset="1" stop-color="#0C91E8"/>
    </linearGradient>
    <linearGradient id="signal" x1="720" y1="0" x2="2220" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#159DDC" stop-opacity="0.88"/>
      <stop offset="0.45" stop-color="#176FCE" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#176FCE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="live">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.34" stop-color="#8CE7FF"/>
      <stop offset="1" stop-color="#087ED4"/>
    </radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feFlood flood-color="#1688F5" flood-opacity="0.2"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="2400" height="800" rx="72" fill="url(#background)"/>
  <rect x="2" y="2" width="2396" height="796" rx="70" fill="none" stroke="#7B94B2" stroke-opacity="0.48" stroke-width="4"/>

  <g transform="translate(80 42) scale(0.77)">
    <path d="M214 474L512 218L810 474V632C810 742 719 830 512 894C305 830 214 742 214 632V474Z"
          fill="none" stroke="#1688F5" stroke-opacity="0.18" stroke-width="70"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M214 474L512 218L810 474V632C810 742 719 830 512 894C305 830 214 742 214 632V474Z"
          fill="none" stroke="url(#outline)" stroke-width="42"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M352 621H672" stroke="#B7CADF" stroke-width="18" stroke-linecap="round"/>
    <path d="M352 621H672" stroke="#159DDC" stroke-width="8" stroke-linecap="round"/>
    <circle cx="388" cy="621" r="26" fill="#E5EFF9" stroke="#2D79BE" stroke-width="10"/>
    <circle cx="636" cy="621" r="26" fill="#E5EFF9" stroke="#2D79BE" stroke-width="10"/>
    <circle cx="512" cy="621" r="48" fill="#1688F5" fill-opacity="0.16" filter="url(#glow)"/>
    <circle cx="512" cy="621" r="34" fill="url(#live)" stroke="#0876C7" stroke-width="6"/>
  </g>

  <path d="M720 400H2220" stroke="#B7CADF" stroke-width="18" stroke-linecap="round"/>
  <path d="M720 400H2220" stroke="url(#signal)" stroke-width="7" stroke-linecap="round"/>
  <path d="M944 328C1160 210 1380 210 1596 328" fill="none" stroke="#176FCE" stroke-opacity="0.14" stroke-width="6" stroke-linecap="round"/>
  <path d="M944 472C1160 590 1380 590 1596 472" fill="none" stroke="#176FCE" stroke-opacity="0.1" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1040" cy="400" r="17" fill="#E5EFF9" stroke="#2D79BE" stroke-width="7"/>
  <circle cx="1390" cy="400" r="24" fill="#1688F5" fill-opacity="0.15" filter="url(#glow)"/>
  <circle cx="1390" cy="400" r="15" fill="#159DDC"/>
  <circle cx="1780" cy="400" r="17" fill="#E5EFF9" stroke="#2D79BE" stroke-width="7"/>
</svg>
