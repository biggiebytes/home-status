<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Home Status logo, light variant</title>
  <desc id="desc">A navy and blue house and shield mark with a live status timeline, designed for light backgrounds.</desc>
  <defs>
    <linearGradient id="outline" x1="520" y1="130" x2="1080" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10243E"/>
      <stop offset="0.44" stop-color="#173E70"/>
      <stop offset="0.74" stop-color="#176FCE"/>
      <stop offset="1" stop-color="#0C91E8"/>
    </linearGradient>
    <linearGradient id="status" x1="620" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5D8FBE"/>
      <stop offset="0.5" stop-color="#159DDC"/>
      <stop offset="1" stop-color="#5D8FBE"/>
    </linearGradient>
    <radialGradient id="live">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.34" stop-color="#8CE7FF"/>
      <stop offset="1" stop-color="#087ED4"/>
    </radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#1688F5" flood-opacity="0.14"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path d="M520 362L800 126L1080 362V520C1080 626 990 714 800 778C610 714 520 626 520 520V362Z"
        fill="none" stroke="#1B8EE9" stroke-opacity="0.1" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M520 362L800 126L1080 362V520C1080 626 990 714 800 778C610 714 520 626 520 520V362Z"
        fill="none" stroke="url(#outline)" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M644 512H956" stroke="#B7CADF" stroke-width="17" stroke-linecap="round"/>
  <path d="M644 512H956" stroke="url(#status)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="680" cy="512" r="25" fill="#E5EFF9" stroke="#2D79BE" stroke-width="9"/>
  <circle cx="920" cy="512" r="25" fill="#E5EFF9" stroke="#2D79BE" stroke-width="9"/>
  <circle cx="800" cy="512" r="43" fill="#1688F5" fill-opacity="0.14" filter="url(#glow)"/>
  <circle cx="800" cy="512" r="33" fill="url(#live)" stroke="#0876C7" stroke-width="6"/>
  <circle cx="790" cy="502" r="8" fill="#FFFFFF" fill-opacity="0.88"/>
</svg>
