<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="800" viewBox="0 0 2400 800" role="img" aria-labelledby="title desc">
  <title id="title">Home Status documentation banner</title>
  <desc id="desc">The Home Status house and shield mark connected to a restrained live-awareness timeline on a dark blue background.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="0" x2="2280" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172335"/>
      <stop offset="0.48" stop-color="#0C1726"/>
      <stop offset="1" stop-color="#07111E"/>
    </linearGradient>
    <linearGradient id="outline" x1="160" y1="100" x2="880" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F9FF"/>
      <stop offset="0.4" stop-color="#C1D9FF"/>
      <stop offset="0.72" stop-color="#4A9CFF"/>
      <stop offset="1" stop-color="#1476F2"/>
    </linearGradient>
    <linearGradient id="signal" x1="720" y1="0" x2="2220" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54DFFF" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#258AF4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#258AF4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="live">
      <stop stop-color="#F2FDFF"/>
      <stop offset="0.36" stop-color="#62E3FF"/>
      <stop offset="1" stop-color="#1688F5"/>
    </radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feFlood flood-color="#1688F5" flood-opacity="0.48"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="2400" height="800" rx="72" fill="url(#background)"/>
  <rect x="2" y="2" width="2396" height="796" rx="70" fill="none" stroke="#6680A1" stroke-opacity="0.3" stroke-width="4"/>
  <circle cx="1510" cy="400" r="310" fill="#0D5FC9" fill-opacity="0.08" filter="url(#soft)"/>

  <g transform="translate(80 42) scale(0.77)">
    <path d="M214 474L512 218L810 474V632C810 742 719 830 512 894C305 830 214 742 214 632V474Z"
          fill="none" stroke="#167FF4" stroke-opacity="0.27" stroke-width="72"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M214 474L512 218L810 474V632C810 742 719 830 512 894C305 830 214 742 214 632V474Z"
          fill="none" stroke="url(#outline)" stroke-width="42"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M352 621H672" stroke="#173A63" stroke-width="18" stroke-linecap="round"/>
    <path d="M352 621H672" stroke="#47BDF5" stroke-width="8" stroke-linecap="round"/>
    <circle cx="388" cy="621" r="26" fill="#102A49" stroke="#4C9DF6" stroke-width="10"/>
    <circle cx="636" cy="621" r="26" fill="#102A49" stroke="#4C9DF6" stroke-width="10"/>
    <circle cx="512" cy="621" r="48" fill="#1688F5" fill-opacity="0.2" filter="url(#glow)"/>
    <circle cx="512" cy="621" r="34" fill="url(#live)" stroke="#C4F6FF" stroke-width="6"/>
  </g>

  <path d="M720 400H2220" stroke="#173557" stroke-width="18" stroke-linecap="round"/>
  <path d="M720 400H2220" stroke="url(#signal)" stroke-width="7" stroke-linecap="round"/>
  <path d="M944 328C1160 210 1380 210 1596 328" fill="none" stroke="#258AF4" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>
  <path d="M944 472C1160 590 1380 590 1596 472" fill="none" stroke="#258AF4" stroke-opacity="0.13" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1040" cy="400" r="17" fill="#173B65" stroke="#4C9DF6" stroke-width="7"/>
  <circle cx="1390" cy="400" r="24" fill="#1688F5" fill-opacity="0.2" filter="url(#glow)"/>
  <circle cx="1390" cy="400" r="15" fill="#62E3FF"/>
  <circle cx="1780" cy="400" r="17" fill="#173B65" stroke="#4C9DF6" stroke-width="7"/>
</svg>
